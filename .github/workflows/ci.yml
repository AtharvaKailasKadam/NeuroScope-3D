name: NeuroScope-3D CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests + Wording Linter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies (CPU-only for CI)
        run: |
          pip install --upgrade pip
          # Install CPU PyTorch (no CUDA needed for unit tests)
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests (skip inference tests that need GPU/model)
        run: |
          pytest tests/ -v --tb=short \
            --ignore=tests/test_e2e.py \
            --ignore=tests/test_timing.py \
            -k "not infer and not pipeline" \
            --junitxml=reports/pytest.xml

      - name: Run wording linter
        run: |
          pytest tests/test_wording.py -v --tb=short

      - name: Run flake8
        run: |
          flake8 core/ api/ tests/ --max-line-length=100 --extend-ignore=E203,W503 \
            --exclude=tests/test_wording.py

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: reports/

  lint-security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for hardcoded paths or 1mm assumptions
        run: |
          # Fail if "1.0, 1.0, 1.0" spacing is hardcoded anywhere except preprocess.py
          ! grep -r "get_zooms\(\)\[0\]" core/ --include="*.py" | grep -v preprocess.py
          echo "✓ No hardcoded 1mm assumptions"
      - name: Check no CDN references in frontend
        run: |
          ! grep -r "cdn.jsdelivr.net\|unpkg.com\|cdnjs.cloudflare.com" web/src/ web/public/ 2>/dev/null
          echo "✓ No external CDN references"
